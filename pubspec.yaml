name: fishing_app
description: Minimal Flutter MVP client for the fishing app.
publish_to: "none"

version: 1.0.2+102

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  geolocator: ^13.0.1
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
